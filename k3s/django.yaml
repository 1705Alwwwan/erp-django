---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: erp-django
  namespace: erp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: erp-django

  template:

    metadata:
      labels:
        app: erp-django

    spec:

      containers:

      - name: erp-django

        image: erp-django:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 8000

        env:

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: DB_USER

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: DB_PORT

        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: ALLOWED_HOSTS

        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: TZ

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: erp-secret
              key: DB_PASSWORD

        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: erp-secret
              key: SECRET_KEY

        resources:

          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

---
apiVersion: v1
kind: Service

metadata:
  name: erp-django
  namespace: erp

spec:

  selector:
    app: erp-django

  ports:
  - name: http
    port: 8000
    targetPort: 8000

  type: ClusterIP
