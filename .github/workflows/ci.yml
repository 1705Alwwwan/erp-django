name: Django CI

on:
  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t erp-django ./app

      - name: Django Check
        run: |
          docker run --rm erp-django \
          python manage.py check
