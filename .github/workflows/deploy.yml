name: Deploy ERP

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: self-hosted

    steps:
      - name: Deploy ERP Django
        run: |
          cd /opt/infra-lab/apps/erp-django

          git pull origin main

          docker compose down

          docker compose up -d --build

          docker image prune -f
